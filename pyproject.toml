[project]
name = "ecommerce-operations-assistant"
version = "0.1.0"
description = "电商运营助手后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0,<2",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "pyjwt[crypto]>=2.10.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "pymysql>=1.1.1,<2",
  "pwdlib[argon2]>=0.3.0,<1",
  "sqlalchemy>=2.0.40,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.0.0,<2",
  "ruff>=0.12.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
